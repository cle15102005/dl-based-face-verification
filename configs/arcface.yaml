# ArcFace  —  InceptionResnetV1 + ArcFace Loss
# Train: CASIA-WebFace identity images (PK batches)
# Val  : CALFW + CPLFW eval pairs
# Test : LFW only (evaluate_lfw.py)

# --- Model identity ---
variant: i                    # Uses data/processed/*/I/ folder (160px crops, pre-resized)
backbone_type: inception      # InceptionResnetV1 — native 160px input, no in-forward resize
loss_type: arcface
checkpoint_name: arcface
input_size: 160               # Matches backbone native input size

# --- Data ---
processed_data_dir: data/processed
max_train_identities: 5000
max_images_per_identity: 30
split_seed: 42

# --- Training loop ---
epochs: 30
batch_size: 32
early_stopping_patience: 15

# --- Optimizer: SGD + MultiStepLR ---
backbone_lr: 5.0e-5        # Lower to preserve pretrained face features
arcface_lr: 1.0e-3
weight_decay: 5.0e-4
lr_milestones: [8, 14]     # Drop LR early when model typically plateaus
lr_decay: 0.5

# --- Backbone ---
dropout: 0.1
unfreeze_ratio: 0.3
freeze_batchnorm: true

# --- ArcFace loss ---
arcface_scale: 64.0
arcface_margin: 0.5

# --- Hard pair mining (auxiliary loss alongside ArcFace) ---
hard_mining_weight: 15.0    # Weight of HardPairContrastiveLoss relative to ArcFace loss
                            # ArcFace loss scale ~30-50 (CrossEntropy on s=64 scaled logits)
                            # HardPair loss scale ~0.2-0.6 (squared cosine terms)
                            # weight=15 → hard mining ≈ 12% of total loss (meaningful)

# Positive pairs (same person, hardest in batch):
#   loss = (pos_threshold - cos)²
#   No dead zone — always penalized. Hard positives always need pushing.
hard_pair_pos_threshold: 1.0   # push cos(same person) → 1.0

# Negative pairs (different person, hardest in batch):
#   loss = clamp(cos - neg_threshold, min=0)²
#   Only penalized if cos > neg_threshold (too similar to a different person).
hard_pair_neg_threshold: 0.5   # push cos(diff person) < 0.5

# --- PK batch sampler ---
p_identities: 32
k_images: 4
min_images: 2

# --- Evaluation ---
lfw_test_augmentation: true

# --- DataLoader ---
num_workers: 8
prefetch_factor: 2
